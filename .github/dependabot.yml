version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    ignore:
      # Next.js のメジャーは固定する（ADR 0004）。上げるときは Issue を立てて行う。
      - dependency-name: next
        update-types:
          - version-update:semver-major
      # Node の型定義は、実行する Node のメジャー（.node-version、engines）と一緒に上げる。
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      # 版がずれると動かないので、同じ PR で上げる。
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
